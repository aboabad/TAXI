name: taxi
description: "Taxi Taste restaurant booking and delivery app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.1.0
  intl: ^0.20.2

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  firebase_app_check: ^0.4.8
  firebase_storage: ^13.6.0

  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  flutter_local_notifications: ^17.2.3
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
